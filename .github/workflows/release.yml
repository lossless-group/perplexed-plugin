name: Release plugin

# Fires when a 3-digit-semver tag is pushed (e.g. 0.1.6). Builds the plugin
# in a clean Ubuntu runner, signs the produced main.js / manifest.json /
# styles.css with GitHub's artifact-attestation (sigstore-backed), and
# creates the GitHub Release with those three files attached. Anyone
# installing can verify provenance with `gh attestation verify <file>
# --repo lossless-group/metafetch`.
#
# Release notes: if changelog/releases/<tag>.md exists in the repo at the tagged
# commit, it's used verbatim as the release body. Otherwise the workflow
# falls back to GitHub's --generate-notes. The convention going forward is
# to author the marketing-shape notes in changelog/releases/<version>.md before
# tagging (per content-farm/context-v/skills/changelog-conventions/SKILL.md
# "These are marketing artifacts" section — every release page is a
# four-audience marketing surface, not a commit-message recap).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # gh release create / asset upload
  id-token: write       # OIDC token for sigstore signing
  attestations: write   # write the attestation to GitHub's attestation API

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Pick release-notes source
        id: notes
        run: |
          # changelog/releases/<tag>.md is a Lossless changelog document:
          # YAML frontmatter + body. The frontmatter exists because the parent
          # splash rolls this folder up and renders it. GitHub wants only the
          # body, so we strip the frontmatter here rather than maintaining a
          # second frontmatter-free copy of the same release narrative.
          #
          # Note for authors: everything after the frontmatter becomes the
          # release page verbatim. Open the body with a bold one-liner if you
          # want a hook — the frontmatter `lede` is NOT prepended, because
          # parsing YAML in bash is a bug farm we don't need.
          CANONICAL="changelog/releases/${GITHUB_REF_NAME}.md"
          LEGACY="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$CANONICAL" ]; then
            SRC="$CANONICAL"
          elif [ -f "$LEGACY" ]; then
            SRC="$LEGACY"
          else
            SRC=""
          fi

          if [ -z "$SRC" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No notes at $CANONICAL or $LEGACY — falling back to --generate-notes"
            exit 0
          fi

          mkdir -p /tmp/relnotes
          BODY="/tmp/relnotes/${GITHUB_REF_NAME}.md"
          awk '
            BEGIN { infm = 0; started = 0 }
            NR == 1 && $0 == "---" { infm = 1; next }
            infm && $0 == "---" { infm = 0; next }
            infm { next }
            { if (!started && $0 == "") next; started = 1; print }
          ' "$SRC" > "$BODY"

          if [ ! -s "$BODY" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "$SRC had no body after frontmatter — falling back to --generate-notes"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$BODY" >> "$GITHUB_OUTPUT"
          echo "Using $SRC (frontmatter stripped) as release body"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.path }}" \
              main.js manifest.json styles.css
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
